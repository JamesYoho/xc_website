<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <!-- Clips the outer card corners -->
    <clipPath id="card-outer-clip">
      <rect x="0" y="0" width="500" height="700" rx="24" />
    </clipPath>

    <!-- Clips the stripe and nameplate cleanly inside the border -->
    <clipPath id="card-inner-clip">
      <rect x="20" y="20" width="460" height="660" rx="12" />
    </clipPath>

    <!-- Subtle drop shadow behind the circular logo medallion -->
    <filter id="medallion-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g clip-path="url(#card-outer-clip)">
    <!-- INNER ELEMENTS (laid directly over the finalist photo) -->
    <g clip-path="url(#card-inner-clip)">
      <!-- Subtle dark bar on the bottom right for HTML finalist name/year -->
      <rect x="115" y="604" width="365" height="76" fill="#111827" fill-opacity="0.88" />
      <line x1="115" y1="604" x2="480" y2="604" stroke="var(--card-accent, #C8102E)" stroke-width="3" />

      <!-- Bottom-left corner fill behind the diagonal stripe -->
      <polygon points="0,535 180,700 0,700" fill="#111827" />

      <!-- Main diagonal stripe (bottom-left) -->
      <polygon points="0,449 273,700 191,700 0,525" fill="var(--card-accent, #C8102E)" />

      <!-- Crisp white accent pinstripes flanking the diagonal stripe -->
      <line x1="0" y1="442" x2="281" y2="700" stroke="#FFFFFF" stroke-width="4" />
      <line x1="0" y1="532" x2="183" y2="700" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- OUTER CARD BORDER (transparent center cutout) -->
    <path fill-rule="evenodd" fill="#18181B" d="M 0,0 H 500 V 700 H 0 Z
         M 32,20 H 468 A 12,12 0 0 1 480,32 V 668 A 12,12 0 0 1 468,680 H 32 A 12,12 0 0 1 20,668 V 32 A 12,12 0 0 1 32,20 Z" />

    <!-- Inner accent pinstripe & outer hairline -->
    <rect x="20" y="20" width="460" height="660" rx="12" stroke="var(--card-accent, #C8102E)" stroke-width="4" />
    <rect x="4" y="4" width="492" height="692" rx="20" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />

    <!-- CIRCULAR MEDALLION (centered on the diagonal stripe) -->
    <g id="logo-medallion" filter="url(#medallion-shadow)">
      <circle cx="115" cy="593" r="58" fill="#18181B" />
      <circle cx="115" cy="593" r="53" fill="var(--card-accent, #C8102E)" />
      <circle cx="115" cy="593" r="47" fill="#FFFFFF" />
      <circle cx="115" cy="593" r="42" stroke="#E5E7EB" stroke-width="1.5" />

      <!-- Red Block "G" (replace this group if dropping in an official GCC logo asset) -->
      <g id="gcc-logo">
        <image href="/images/GroveCityLogo.png" x="78" y="556" width="74" height="74" />
      </g>
    </g>
  </g>
</svg>